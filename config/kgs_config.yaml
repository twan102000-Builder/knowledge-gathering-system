# Knowledge Gathering System (KGS) Configuration
# Dual-Tier Architecture: On-Device Mac Repo <--> 1TB Portable Removable Main Archive
# (Host 990 PRO NVMe is treated strictly as a local Mac mini storage extension)

# Primary on-device local repository (fast local NVMe cache for capture, reading, and offline search)
vault:
  root_path: "~/KnowRepo_Local"
  index_dir: "00_Index_and_Manifests"
  snippets_dir: "07_Uncategorized_Inbox/snippets"
  media_dir: "07_Uncategorized_Inbox/media"
  daily_dir: "07_Uncategorized_Inbox/daily"
  sd_imports_dir: "07_Uncategorized_Inbox/sd_imports"

# Dual-Tier Storage Architecture
tier_architecture:
  enabled: true
  local_repo_path: "~/KnowRepo_Local"
  main_archive:
    auto_detect_portable_drive: true
    target_capacity_gb: 1000
    knowrepo_partition_keywords:
      - "KnowRepo"
      - "KnowRepo1"
      - "KnowRepo_Archive"
      - "Know_Repo"
      - "KnowRepo_Main"
  auto_offload_threshold_mb: 25
  clean_macos_artifacts: true

database:
  path: "~/KnowRepo_Local/00_Index_and_Manifests/kgs_metadata.db"

staging:
  path: "/tmp/knowrepo_stage"
  purge_after_sync: true

clipboard:
  debounce_seconds: 0.8
  max_text_size_bytes: 10485760 # 10MB
  capture_images: true
  auto_tag_urls: true

sd_storage:
  allowed_filesystems:
    - apfs
    - hfs+
    - vfat
    - exfat
    - ext4
    - ntfs
  preferred_mount_parent: "/tmp/kgs_mounts"
  safe_mode_read_only: true
  file_extensions_filter: []
